name: Archive verified socrates build

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: archive-socrates-f64d5c7
  cancel-in-progress: false

jobs:
  archive:
    if: github.repository == 'Dingtaiqi/skyward'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify and archive the exact tested build as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/archive-socrates.py
